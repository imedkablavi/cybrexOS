# CybrexTech OS – Kernel Security Hardening
# Location: /etc/sysctl.d/99-cybrex-hardening.conf
# Applied automatically by systemd-sysctl on boot.

# ---------------------------------------------------------------------------
# Network hardening
# ---------------------------------------------------------------------------

# Disable IP forwarding (not a router)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Ignore ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Do not send ICMP redirects
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Ignore bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Log martian packets (packets with impossible source addresses)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Protect against SYN-flood attacks (SYN cookies)
net.ipv4.tcp_syncookies = 1

# Disable source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Reverse-path filter (strict mode)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable IPv6 router advertisements
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# TCP hardening
net.ipv4.tcp_rfc1337 = 1

# ---------------------------------------------------------------------------
# Memory / kernel hardening
# ---------------------------------------------------------------------------

# Restrict ptrace to parent processes only (Yama)
kernel.yama.ptrace_scope = 1

# Restrict dmesg to root only
kernel.dmesg_restrict = 1

# Restrict kernel pointer leaks
kernel.kptr_restrict = 2

# Disable kexec (prevents loading alternative kernels at runtime)
kernel.kexec_load_disabled = 1

# Disable magic SysRq key (prevents privileged low-level kernel ops)
kernel.sysrq = 0

# Enable ASLR (full randomisation)
kernel.randomize_va_space = 2

# Restrict access to performance events
kernel.perf_event_paranoid = 3

# Prevent core dumps containing setuid executable data
fs.suid_dumpable = 0

# Increase inotify watch limits for development workloads
fs.inotify.max_user_watches = 524288
