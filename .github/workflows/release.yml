name: Release candidate

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        default: alpha
        options:
          - alpha
          - beta
          - stable
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
      - 'build_scripts/**'
      - 'ci/**'
      - 'release/**'
      - 'rootfs/**'
      - 'docs/RELEASE_CHANNELS.md'
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    name: Build, qualify and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
              channel=alpha
            elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              channel=beta
            elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              channel=stable
            else
              echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            channel='${{ inputs.channel }}'
          else
            channel=alpha
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Release channel: $channel"

      - name: Enforce implemented channel gates
        run: |
          set -euo pipefail
          channel='${{ steps.channel.outputs.channel }}'
          if [[ "$channel" != "alpha" ]]; then
            echo "Channel '$channel' is defined but promotion is intentionally blocked." >&2
            echo "Complete the additional gates in docs/RELEASE_CHANNELS.md before enabling it." >&2
            exit 1
          fi

      - name: Static release contracts
        run: bash tests/release_contracts.sh

      - name: Install build and VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring parted dosfstools e2fsprogs rsync util-linux qemu-utils \
            qemu-system-x86 ovmf

      - name: Build qualification image
        run: |
          sudo env \
            GITHUB_SHA="$GITHUB_SHA" \
            CYBREX_CI_SMOKE=1 \
            SKIP_VMDK=1 \
            DISK_SIZE=4G \
            BUILD_CHANNEL='${{ steps.channel.outputs.channel }}' \
            bash build_scripts/build_vm.sh

      - name: Deep QEMU OVMF qualification
        run: sudo bash ci/smoke_boot_qemu.sh build_vm/CybrexTech_Dev_Preview.img

      - name: Preserve deep qualification evidence
        run: sudo cp build_vm/qemu-boot.log /tmp/cybrex-qemu-boot.log

      - name: Build clean release artifact
        run: |
          sudo env \
            GITHUB_SHA="$GITHUB_SHA" \
            CYBREX_CI_SMOKE=0 \
            SKIP_VMDK=0 \
            DISK_SIZE=8G \
            BUILD_CHANNEL='${{ steps.channel.outputs.channel }}' \
            bash build_scripts/build_vm.sh
          sudo cp /tmp/cybrex-qemu-boot.log artifacts/qualification-qemu-boot.log
          sudo cp CybrexTech_Dev_Preview.vmx artifacts/CybrexTech_Dev_Preview.vmx
          sudo sed -i \
            's#scsi0:0.fileName = "artifacts/CybrexTech_Dev_Preview.vmdk"#scsi0:0.fileName = "CybrexTech_Dev_Preview.vmdk"#' \
            artifacts/CybrexTech_Dev_Preview.vmx
          grep -F 'scsi0:0.fileName = "CybrexTech_Dev_Preview.vmdk"' \
            artifacts/CybrexTech_Dev_Preview.vmx
          sudo chown -R "$(id -u):$(id -g)" artifacts

      - name: Generate attestable SPDX JSON SBOM
        run: |
          python3 release/generate_spdx_json.py \
            artifacts/packages.tsv artifacts/cybrexOS.spdx.json
          python3 -m json.tool artifacts/cybrexOS.spdx.json >/dev/null

      - name: Qualify final VMDK artifact without mutating release bytes
        shell: bash
        run: |
          set -euo pipefail
          release_vmdk='artifacts/CybrexTech_Dev_Preview.vmdk'
          test_vmdk='/tmp/CybrexTech_Dev_Preview-qualification.vmdk'
          release_before="$(sha256sum "$release_vmdk" | awk '{print $1}')"
          cp --sparse=always "$release_vmdk" "$test_vmdk"
          test_before="$(sha256sum "$test_vmdk" | awk '{print $1}')"
          [[ "$release_before" == "$test_before" ]] || {
            echo 'Qualification copy does not match release VMDK' >&2
            exit 1
          }
          bash ci/qualify_release_vmdk.sh "$test_vmdk"
          rm -f "$test_vmdk"
          release_after="$(sha256sum "$release_vmdk" | awk '{print $1}')"
          [[ "$release_before" == "$release_after" ]] || {
            echo 'Release VMDK changed during qualification' >&2
            exit 1
          }
          echo "Release VMDK remained immutable: $release_after"

      - name: Finalize release checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd artifacts
            sha256sum \
              CybrexTech_Dev_Preview.vmdk \
              CybrexTech_Dev_Preview.vmx \
              cybrexOS.spdx \
              cybrexOS.spdx.json \
              packages.tsv \
              build-report.txt \
              REPRODUCIBILITY.md \
              qualification-qemu-boot.log \
              qualification-release-vmdk.txt \
              qualification-release-vmdk-qemu.log \
              > SHA256SUMS
          )

      - name: Verify generated checksums
        env:
          VERIFY_PROVENANCE: '0'
        run: bash release/verify-release.sh artifacts

      - name: Create signed build provenance
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/attest@v4
        with:
          subject-path: artifacts/CybrexTech_Dev_Preview.vmdk

      - name: Create signed SPDX SBOM attestation
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/attest@v4
        with:
          subject-path: artifacts/CybrexTech_Dev_Preview.vmdk
          sbom-path: artifacts/cybrexOS.spdx.json

      - name: Verify provenance and SBOM attestations
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_PROVENANCE: '1'
          VERIFY_SBOM_ATTESTATION: '1'
        run: bash release/verify-release.sh artifacts

      - name: Upload release candidate bundle
        uses: actions/upload-artifact@v6
        with:
          name: cybrexOS-${{ steps.channel.outputs.channel }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/CybrexTech_Dev_Preview.vmdk
            artifacts/CybrexTech_Dev_Preview.vmx
            artifacts/cybrexOS.spdx
            artifacts/cybrexOS.spdx.json
            artifacts/packages.tsv
            artifacts/build-report.txt
            artifacts/REPRODUCIBILITY.md
            artifacts/SHA256SUMS
            artifacts/qualification-qemu-boot.log
            artifacts/qualification-release-vmdk.txt
            artifacts/qualification-release-vmdk-qemu.log

      - name: Upload qualification evidence on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cybrexOS-release-failure-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build_vm/report.txt
            build_vm/qemu-boot.log
            artifacts/
